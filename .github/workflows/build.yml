name: Build APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK and signed release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/release.jks"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"
            echo "Keystore decoded to ${KEYSTORE_FILE} ($(wc -c < "${KEYSTORE_FILE}") bytes)."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the release bundle will be UNSIGNED."
          fi

      - name: Build debug APK and release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug bundleRelease

      - name: Verify artifacts
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -lh "${APK}" "${AAB}"
          echo "--- release bundle signer ---"
          keytool -printcert -jarfile "${AAB}"
          {
            echo "### Build artifacts"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| app-debug.apk | $(du -h "${APK}" | cut -f1) | $(sha256sum "${APK}" | cut -d' ' -f1) |"
            echo "| app-release.aab | $(du -h "${AAB}" | cut -f1) | $(sha256sum "${AAB}" | cut -d' ' -f1) |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
