<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#061510">
<title>크리스마스 2048</title>
<style>
  :root {
    --night-0: #04100C;
    --night-1: #0A2019;
    --night-2: #0E3226;
    --emerald: #1E7A4C;
    --gold: #E8C26A;
    --gold-bright: #F6DA96;
    --red: #B4233A;
    --cream: #F7EEDD;
    --frost: #DCEFE6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; background: var(--night-0); }
  html, body { margin: 0; }
  body {
    position: relative;
    height: 100%;
    color: var(--frost);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Malgun Gothic", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    background:
      radial-gradient(120% 78% at 50% -12%, #14513A 0%, rgba(10, 32, 25, 0) 58%),
      radial-gradient(95% 62% at 104% 104%, rgba(146, 24, 44, .42) 0%, rgba(146, 24, 44, 0) 62%),
      linear-gradient(180deg, #061510 0%, #04100C 58%, #071A12 100%);
  }
  /* soft snow, drawn behind everything and never blocking a touch */
  #snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: .85;
  }
  #app {
    position: relative;
    z-index: 1;
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 14px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.2px;
    line-height: 1.12;
    color: #BFDCCF;
  }
  h1 em {
    display: block;
    font-style: normal;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -.8px;
    color: var(--gold-bright);
    text-shadow: 0 0 16px rgba(246, 218, 150, .38);
  }
  .scores { display: flex; gap: 8px; }
  .score-box {
    position: relative;
    min-width: 76px;
    padding: 6px 11px;
    background: rgba(8, 32, 25, .78);
    border: 1px solid rgba(232, 194, 106, .26);
    border-radius: 10px;
    text-align: center;
    color: var(--cream);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
  }
  .score-box .label { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: 1.3px; color: rgba(232, 194, 106, .82); }
  .score-box .value { display: block; font-size: 19px; font-weight: 800; line-height: 1.25; font-variant-numeric: tabular-nums; }
  #score-gain {
    position: absolute; left: 50%; top: 1px;
    font-size: 15px; font-weight: 800; color: var(--gold-bright);
    opacity: 0; pointer-events: none; white-space: nowrap;
    text-shadow: 0 0 10px rgba(246, 218, 150, .6);
  }
  #score-gain.show { animation: gainUp .65s ease-out; }
  @keyframes gainUp {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -26px); }
  }
  .controls { display: flex; gap: 8px; align-items: center; }
  button {
    font-family: inherit;
    border: 0;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 800;
    color: var(--cream);
    background: #1B4A38;
    transition: opacity .15s, transform .06s;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .35; }
  #new {
    background: linear-gradient(180deg, var(--gold-bright), #D9AE52);
    color: #2A1B05;
    box-shadow: 0 4px 14px rgba(217, 174, 82, .26);
  }
  button.ghost {
    background: rgba(10, 36, 28, .86);
    color: #CFE9DD;
    box-shadow: inset 0 0 0 1px rgba(232, 194, 106, .3);
  }
  .spacer { flex: 1; }
  #board-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #board {
    --cell: 70px;
    position: relative;
    background: linear-gradient(160deg, #103A2B 0%, #0A241B 100%);
    border: 1px solid rgba(232, 194, 106, .3);
    border-radius: 14px;
    overflow: hidden;
    touch-action: none;
    box-shadow: 0 12px 30px rgba(0, 0, 0, .48), inset 0 0 44px rgba(0, 0, 0, .34);
  }
  #board.bump { animation: bump .18s ease-out; }
  @keyframes bump {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-4px); }
    65% { transform: translateX(4px); }
  }
  .grid, .tiles { position: absolute; inset: 0; }
  .bg-cell {
    position: absolute;
    border-radius: 7px;
    background: rgba(226, 245, 236, .05);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045);
  }
  .tile { position: absolute; left: 0; top: 0; will-change: transform; transition: transform .11s ease-out; }
  .tile-inner {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 7px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    line-height: 1;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    background: #16443A;
    color: var(--frost);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06), 0 1px 2px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  /* the Christmas symbol sits above the number; the inner text stays the plain
     number so the score rules read exactly as before */
  .tile-inner::before {
    content: "";
    font-size: calc(var(--cell) * .27);
    line-height: 1;
    margin-bottom: calc(var(--cell) * .045);
    filter: saturate(1.05);
  }
  .tile-0 .tile-inner { background: #143C32; }
  .tile-2 .tile-inner { background: #16443A; color: #E4F4EC; }
  .tile-2 .tile-inner::before { content: "❄️"; }
  .tile-4 .tile-inner { background: #1C5240; color: #EAF8F1; }
  .tile-4 .tile-inner::before { content: "🧦"; }
  .tile-8 .tile-inner { background: #63202C; color: #FFE4E9; }
  .tile-8 .tile-inner::before { content: "🍬"; }
  .tile-16 .tile-inner { background: #7A5518; color: #FFF0CC; }
  .tile-16 .tile-inner::before { content: "🔔"; }
  .tile-32 .tile-inner { background: #9E4A16; color: #FFF0DE; }
  .tile-32 .tile-inner::before { content: "🕯️"; }
  .tile-64 .tile-inner { background: #215F63; color: #E6FBFF; }
  .tile-64 .tile-inner::before { content: "⛄"; }
  .tile-128 .tile-inner { background: #4A2545; color: #F7E6F1; }
  .tile-128 .tile-inner::before { content: "🦌"; }
  .tile-256 .tile-inner { background: #1E3A5F; color: #E6F0FF; }
  .tile-256 .tile-inner::before { content: "🎄"; }
  .tile-512 .tile-inner { background: #B01B33; color: #FFF0F3; box-shadow: inset 0 0 0 1px rgba(255, 226, 226, .18); }
  .tile-512 .tile-inner::before { content: "🎁"; }
  .tile-1024 .tile-inner {
    background: linear-gradient(165deg, #F6DA96 0%, #D9A227 100%);
    color: #2A1C00;
    box-shadow: inset 0 0 0 1px rgba(255, 244, 206, .55), 0 0 16px rgba(217, 162, 39, .4);
  }
  .tile-1024 .tile-inner::before { content: "⭐"; }
  .tile-2048 .tile-inner {
    background: radial-gradient(120% 120% at 50% 0%, #E8395A 0%, #B01B33 62%, #8A1228 100%);
    color: #FFF4F6;
    box-shadow: inset 0 0 0 1px rgba(246, 218, 150, .65), 0 0 22px rgba(232, 57, 90, .5);
  }
  .tile-2048 .tile-inner::before { content: "🎅"; }
  .tile-super .tile-inner {
    background: radial-gradient(120% 120% at 50% 0%, #2B1B3A 0%, #120A1C 100%);
    color: var(--gold-bright);
    box-shadow: inset 0 0 0 1px rgba(246, 218, 150, .55), 0 0 20px rgba(246, 218, 150, .24);
  }
  .tile-super .tile-inner::before { content: "✨"; }
  .tile-new .tile-inner { animation: appear .16s ease-out; }
  @keyframes appear { from { transform: scale(.2); opacity: .4; } to { transform: scale(1); opacity: 1; } }
  .tile-merged .tile-inner { animation: pop .2s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: rgba(4, 16, 12, .87);
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease-out;
    z-index: 5;
    text-align: center;
    padding: 18px;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay .msg { font-size: 27px; font-weight: 900; color: var(--gold-bright); letter-spacing: -.5px; text-shadow: 0 0 18px rgba(246, 218, 150, .35); }
  .overlay .sub { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: #A9C8BA; }
  .overlay.win { background: radial-gradient(130% 110% at 50% 0%, rgba(176, 27, 51, .95) 0%, rgba(92, 12, 30, .96) 100%); }
  .overlay.win .msg { color: #FFF0D2; text-shadow: 0 2px 14px rgba(0, 0, 0, .35); }
  .overlay.win .sub { color: rgba(255, 236, 208, .82); }
  .overlay.win button { background: linear-gradient(180deg, var(--gold-bright), #D9AE52); color: #2A1B05; }
  .hint { margin: 0; text-align: center; font-size: 12px; color: #7E9C92; }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="app">
  <header>
    <h1>크리스마스<em>2048</em></h1>
    <div class="scores">
      <div class="score-box">
        <span class="label">SCORE</span>
        <span class="value" id="score">0</span>
        <span id="score-gain"></span>
      </div>
      <div class="score-box">
        <span class="label">BEST</span>
        <span class="value" id="best">0</span>
      </div>
    </div>
  </header>

  <div class="controls">
    <button id="new">새 게임</button>
    <button id="undo" class="ghost" disabled>되돌리기</button>
    <div class="spacer"></div>
  </div>

  <div id="board-wrap">
    <div id="board">
      <div class="grid" id="grid"></div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay">
        <div class="msg" id="overlay-msg"></div>
        <p class="sub" id="overlay-sub"></p>
        <button id="overlay-btn"></button>
      </div>
    </div>
  </div>

  <p class="hint">스와이프하거나 방향키로 타일을 움직이세요</p>
</div>

<script>
(function () {
  'use strict';

  var SIZE = 4;
  var MOVE_MS = 110;
  var STORE_KEY = 'pishon2048.v1';

  var boardEl = document.getElementById('board');
  var gridEl = document.getElementById('grid');
  var tilesEl = document.getElementById('tiles');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var gainEl = document.getElementById('score-gain');
  var undoBtn = document.getElementById('undo');
  var overlayEl = document.getElementById('overlay');
  var overlayMsg = document.getElementById('overlay-msg');
  var overlaySub = document.getElementById('overlay-sub');
  var overlayBtn = document.getElementById('overlay-btn');

  var grid = [];
  var tiles = [];
  var tileEls = {};
  var idSeq = 1;
  var score = 0;
  var best = 0;
  var undoState = null;
  var busy = false;
  var over = false;
  var wonShown = false;

  var cell = 0, gap = 0, pad = 0;

  var VECTORS = {
    up: { r: -1, c: 0 },
    right: { r: 0, c: 1 },
    down: { r: 1, c: 0 },
    left: { r: 0, c: -1 }
  };

  /* ---------- helpers ---------- */

  function makeGrid() {
    var g = [];
    for (var r = 0; r < SIZE; r++) {
      var row = [];
      for (var c = 0; c < SIZE; c++) row.push(null);
      g.push(row);
    }
    return g;
  }

  function inBounds(r, c) { return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }

  function emptyCells() {
    var out = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) if (!grid[r][c]) out.push({ r: r, c: c });
    }
    return out;
  }

  function classFor(v) {
    if (v <= 2048) return 'tile-' + v;
    return 'tile-super';
  }

  /* The number stays the largest thing on a tile; the Christmas symbol is painted
     above it by CSS so the two read together without hiding the 2048 numbers. */
  function fontSizeFor(v) {
    var len = String(v).length;
    var ratio = len <= 2 ? 0.34 : (len === 3 ? 0.29 : (len === 4 ? 0.245 : 0.2));
    return Math.max(10, Math.round(cell * ratio));
  }

  function posX(c) { return pad + c * (cell + gap); }
  function posY(r) { return pad + r * (cell + gap); }

  /* ---------- layout ---------- */

  function layout() {
    var wrap = document.getElementById('board-wrap');
    var avail = Math.min(wrap.clientWidth, wrap.clientHeight);
    if (!avail || avail < 120) return;

    pad = Math.round(avail * 0.026);
    gap = Math.round(avail * 0.026);
    cell = Math.floor((avail - pad * 2 - gap * (SIZE - 1)) / SIZE);
    var boardSize = cell * SIZE + gap * (SIZE - 1) + pad * 2;

    boardEl.style.width = boardSize + 'px';
    boardEl.style.height = boardSize + 'px';
    if (boardEl.style.setProperty) boardEl.style.setProperty('--cell', cell + 'px');

    gridEl.innerHTML = '';
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var d = document.createElement('div');
        d.className = 'bg-cell';
        d.style.left = posX(c) + 'px';
        d.style.top = posY(r) + 'px';
        d.style.width = cell + 'px';
        d.style.height = cell + 'px';
        gridEl.appendChild(d);
      }
    }

    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      var el = tileEls[t.id];
      if (!el) continue;
      el.style.width = cell + 'px';
      el.style.height = cell + 'px';
      var inner = el.firstChild;
      if (inner) inner.style.fontSize = fontSizeFor(t.value) + 'px';
      place(t, false);
    }
  }

  function place(tile, animate) {
    var el = tileEls[tile.id];
    if (!el) return;
    if (!animate) el.style.transition = 'none';
    el.style.transform = 'translate(' + posX(tile.c) + 'px,' + posY(tile.r) + 'px)';
    if (!animate) {
      void el.offsetWidth;
      el.style.transition = '';
    }
  }

  /* ---------- tiles ---------- */

  function createTileEl(tile, isNew) {
    var el = document.createElement('div');
    el.className = 'tile ' + classFor(tile.value) + (isNew ? ' tile-new' : '');
    el.style.width = cell + 'px';
    el.style.height = cell + 'px';

    var inner = document.createElement('div');
    inner.className = 'tile-inner';
    inner.textContent = String(tile.value);
    inner.style.fontSize = fontSizeFor(tile.value) + 'px';
    el.appendChild(inner);

    tilesEl.appendChild(el);
    tileEls[tile.id] = el;
    place(tile, false);
    return el;
  }

  function refreshTileEl(tile, pop) {
    var el = tileEls[tile.id];
    if (!el) return;
    el.className = 'tile ' + classFor(tile.value) + (pop ? ' tile-merged' : '');
    var inner = el.firstChild;
    if (inner) {
      inner.textContent = String(tile.value);
      inner.style.fontSize = fontSizeFor(tile.value) + 'px';
    }
    if (pop) {
      void el.offsetWidth;
    }
  }

  function addTile(r, c, value, isNew) {
    var t = { id: idSeq++, r: r, c: c, value: value, merged: false };
    grid[r][c] = t;
    tiles.push(t);
    createTileEl(t, isNew !== false);
    return t;
  }

  function addRandomTile() {
    var spots = emptyCells();
    if (!spots.length) return null;
    var spot = spots[Math.floor(Math.random() * spots.length)];
    var value = Math.random() < 0.9 ? 2 : 4;
    return addTile(spot.r, spot.c, value, true);
  }

  /* ---------- game state ---------- */

  function valuesOf() {
    var out = [];
    for (var r = 0; r < SIZE; r++) {
      var row = [];
      for (var c = 0; c < SIZE; c++) row.push(grid[r][c] ? grid[r][c].value : 0);
      out.push(row);
    }
    return out;
  }

  function loadValues(values) {
    grid = makeGrid();
    tilesEl.innerHTML = '';
    tileEls = {};
    tiles = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = values && values[r] ? (values[r][c] | 0) : 0;
        if (v > 0) addTile(r, c, v, false);
      }
    }
  }

  function setScore(v) {
    score = v;
    scoreEl.textContent = String(score);
    if (score > best) {
      best = score;
      bestEl.textContent = String(best);
    }
  }

  function showGain(n) {
    gainEl.textContent = '+' + n;
    gainEl.classList.remove('show');
    void gainEl.offsetWidth;
    gainEl.classList.add('show');
  }

  function updateUndoBtn() {
    undoBtn.disabled = !undoState;
  }

  function saveState() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        v: 1,
        values: valuesOf(),
        score: score,
        best: best
      }));
    } catch (e) { /* storage unavailable */ }
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.values) || d.values.length !== SIZE) return null;
      for (var i = 0; i < SIZE; i++) {
        if (!Array.isArray(d.values[i]) || d.values[i].length !== SIZE) return null;
      }
      return d;
    } catch (e) {
      return null;
    }
  }

  function canMove() {
    if (emptyCells().length) return true;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = grid[r][c].value;
        if (c + 1 < SIZE && grid[r][c + 1].value === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c].value === v) return true;
      }
    }
    return false;
  }

  function hasValue(v) {
    for (var i = 0; i < tiles.length; i++) if (tiles[i].value >= v) return true;
    return false;
  }

  /* ---------- overlay ---------- */

  function showOverlay(text, buttonLabel, isWin, subText) {
    overlayMsg.textContent = text;
    if (overlaySub) overlaySub.textContent = subText || '';
    overlayBtn.textContent = buttonLabel;
    overlayEl.classList.toggle('win', !!isWin);
    overlayEl.classList.add('show');
  }

  function hideOverlay() {
    overlayEl.classList.remove('show');
    overlayEl.classList.remove('win');
  }

  /* ---------- moves ---------- */

  function farthest(pos, v) {
    var prev = null;
    var r = pos.r + v.r;
    var c = pos.c + v.c;
    while (inBounds(r, c) && !grid[r][c]) {
      prev = { r: r, c: c };
      r += v.r;
      c += v.c;
    }
    var nextCell = inBounds(r, c) ? { r: r, c: c } : null;
    return {
      farthest: prev || { r: pos.r, c: pos.c },
      nextCell: nextCell
    };
  }

  function move(dir) {
    if (busy || over) return;
    var v = VECTORS[dir];
    if (!v) return;

    var xs = [0, 1, 2, 3];
    var ys = [0, 1, 2, 3];
    if (v.c === 1) xs.reverse();
    if (v.r === 1) ys.reverse();

    var snapshot = { values: valuesOf(), score: score };
    var moved = false;
    var gained = 0;
    var reached2048 = false;
    var merges = [];
    var i;

    for (i = 0; i < tiles.length; i++) tiles[i].merged = false;

    for (var yi = 0; yi < SIZE; yi++) {
      for (var xi = 0; xi < SIZE; xi++) {
        var r = ys[yi], c = xs[xi];
        var tile = grid[r][c];
        if (!tile) continue;

        var res = farthest({ r: r, c: c }, v);
        var nextTile = res.nextCell ? grid[res.nextCell.r][res.nextCell.c] : null;

        if (nextTile && nextTile.value === tile.value && !nextTile.merged) {
          nextTile.value *= 2;
          nextTile.merged = true;
          grid[r][c] = null;
          tile.r = nextTile.r;
          tile.c = nextTile.c;
          merges.push({ from: tile.id, to: nextTile.id });
          gained += nextTile.value;
          if (nextTile.value >= 2048) reached2048 = true;
          moved = true;
        } else {
          var f = res.farthest;
          if (f.r !== r || f.c !== c) {
            grid[r][c] = null;
            grid[f.r][f.c] = tile;
            tile.r = f.r;
            tile.c = f.c;
            moved = true;
          }
        }
      }
    }

    if (!moved) {
      bump();
      return;
    }

    undoState = snapshot;
    updateUndoBtn();
    busy = true;

    for (i = 0; i < tiles.length; i++) place(tiles[i], true);

    setTimeout(function () {
      for (var m = 0; m < merges.length; m++) {
        var fromId = merges[m].from;
        var toId = merges[m].to;
        var fromEl = tileEls[fromId];
        if (fromEl && fromEl.parentNode) fromEl.parentNode.removeChild(fromEl);
        delete tileEls[fromId];

        for (var k = 0; k < tiles.length; k++) {
          if (tiles[k].id === fromId) { tiles.splice(k, 1); break; }
        }

        for (var j = 0; j < tiles.length; j++) {
          if (tiles[j].id === toId) { refreshTileEl(tiles[j], true); break; }
        }
      }

      if (gained > 0) {
        setScore(score + gained);
        showGain(gained);
      }

      addRandomTile();

      var won = false;
      if (!wonShown && (reached2048 || hasValue(2048))) {
        wonShown = true;
        won = true;
      }

      busy = false;
      saveState();

      if (won) {
        showOverlay('2048 달성!', '계속하기', true, '메리 크리스마스!');
      } else if (!canMove()) {
        over = true;
        showOverlay('게임 오버', '새 게임', false, '새 게임으로 다시 도전해 보세요');
      }
    }, MOVE_MS);
  }

  function bump() {
    boardEl.classList.remove('bump');
    void boardEl.offsetWidth;
    boardEl.classList.add('bump');
  }

  /* ---------- commands ---------- */

  function newGame() {
    hideOverlay();
    loadValues(null);
    setScore(0);
    undoState = null;
    updateUndoBtn();
    over = false;
    wonShown = false;
    busy = false;
    addRandomTile();
    addRandomTile();
    saveState();
  }

  function undo() {
    if (!undoState) return;
    loadValues(undoState.values);
    setScore(undoState.score);
    undoState = null;
    updateUndoBtn();
    over = false;
    hideOverlay();
    saveState();
  }

  /* ---------- input ---------- */

  function bindKeys() {
    document.addEventListener('keydown', function (e) {
      var map = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
        w: 'up', a: 'left', s: 'down', d: 'right',
        W: 'up', A: 'left', S: 'down', D: 'right',
        k: 'up', h: 'left', j: 'down', l: 'right'
      };
      var dir = map[e.key];
      if (!dir) return;
      e.preventDefault();
      move(dir);
    });
  }

  function bindSwipe() {
    var startX = 0, startY = 0, active = false, pointerId = null;
    var THRESHOLD = 22;

    boardEl.addEventListener('pointerdown', function (e) {
      if (busy || over) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      active = true;
      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      try { boardEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    });

    boardEl.addEventListener('pointerup', function (e) {
      if (!active || e.pointerId !== pointerId) return;
      active = false;
      pointerId = null;
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      var ax = Math.abs(dx);
      var ay = Math.abs(dy);
      if (Math.max(ax, ay) < THRESHOLD) return;
      if (ax > ay) move(dx > 0 ? 'right' : 'left');
      else move(dy > 0 ? 'down' : 'up');
    });

    boardEl.addEventListener('pointercancel', function () {
      active = false;
      pointerId = null;
    });

    document.addEventListener('touchmove', function (e) {
      if (e.target && boardEl.contains(e.target)) e.preventDefault();
    }, { passive: false });
  }

  /* ---------- snow ---------- */

  /* A small canvas of drifting flakes. It is deliberately cheap: a few dozen
     circles, no shadows or blur, device pixels capped at 2x, and the animation
     stops completely while the app is in the background. */
  function initSnow() {
    var canvas = document.getElementById('snow');
    if (!canvas || !canvas.getContext || typeof window.requestAnimationFrame !== 'function') return;

    var ctx = canvas.getContext('2d');
    if (!ctx) return;

    var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = 0, h = 0, flakes = [], rafId = null, lastTs = 0, running = false;

    function newFlake(atTop) {
      var r = 0.7 + Math.random() * 1.9;
      return {
        x: Math.random() * w,
        y: atTop ? -r * 2 - Math.random() * h * 0.3 : Math.random() * h,
        r: r,
        vy: 5 + r * 4 + Math.random() * 7,
        drift: 4 + Math.random() * 8,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.22 + Math.random() * 0.45
      };
    }

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      if (ctx.setTransform) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      var count = Math.round(Math.min(46, Math.max(16, (w * h) / 17000)));
      if (reduce) count = Math.round(count / 2);
      flakes = [];
      for (var i = 0; i < count; i++) flakes.push(newFlake(false));
    }

    function frame(ts) {
      if (!running) return;
      var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0.016;
      lastTs = ts;

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#FFFFFF';
      var t = ts / 1000;
      for (var i = 0; i < flakes.length; i++) {
        var f = flakes[i];
        f.y += f.vy * dt;
        f.x += Math.sin(t * 0.6 + f.phase) * f.drift * dt;
        if (f.y - f.r > h) { flakes[i] = newFlake(true); continue; }
        if (f.x < -6) f.x = w + 6;
        else if (f.x > w + 6) f.x = -6;
        ctx.globalAlpha = f.alpha;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      rafId = window.requestAnimationFrame(frame);
    }

    function start() {
      if (running) return;
      running = true;
      lastTs = 0;
      rafId = window.requestAnimationFrame(frame);
    }

    function stop() {
      running = false;
      if (rafId !== null && window.cancelAnimationFrame) window.cancelAnimationFrame(rafId);
      rafId = null;
    }

    resize();
    start();

    if (window.addEventListener) {
      window.addEventListener('resize', resize);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') stop();
        else start();
      });
    }
  }

  /* ---------- boot ---------- */

  function boot() {
    document.getElementById('new').addEventListener('click', newGame);
    undoBtn.addEventListener('click', undo);
    overlayBtn.addEventListener('click', function () {
      if (over) newGame();
      else hideOverlay();
    });

    bindKeys();
    bindSwipe();
    initSnow();

    var saved = loadState();
    layout();

    if (saved) {
      best = Math.max(saved.best | 0, saved.score | 0);
      bestEl.textContent = String(best);
      loadValues(saved.values);
      setScore(saved.score | 0);
      if (!canMove()) {
        over = true;
        showOverlay('게임 오버', '새 게임', false, '새 게임으로 다시 도전해 보세요');
      }
      if (hasValue(2048)) wonShown = true;
      undoState = null;
      updateUndoBtn();
      if (tiles.length === 0) newGame();
    } else {
      newGame();
    }

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(layout, 80);
    });
    window.addEventListener('orientationchange', function () {
      setTimeout(layout, 180);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') saveState();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
